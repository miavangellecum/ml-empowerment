<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spend — Receipts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* ── dark scene ── */
        .receipts-scene {
            position: relative;
            min-height: 100vh;
            padding: 28px 20px 130px;
            background: #231F1A;
            color: #F4EDE2;
            overflow: hidden;
        }

        /* ── floating orbs (different arrangement) ── */
        .receipts-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .receipts-orbs .orb {
            position: absolute;
            border-radius: 50%;
            will-change: transform;
            transition: transform 0.08s ease-out;
            backface-visibility: hidden;
        }
        .receipts-orbs .o1 {
            width: 400px;
            height: 400px;
            background: #E8492D;
            top: -60px;
            left: -80px;
            opacity: 0.9;
        }
        .receipts-orbs .o2 {
            width: 300px;
            height: 300px;
            background: #F0B93E;
            bottom: 10%;
            right: -60px;
            opacity: 0.85;
        }
        .receipts-orbs .o3 {
            width: 200px;
            height: 200px;
            background: #7C9A79;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.8;
        }
        .receipts-orbs .o4 {
            width: 140px;
            height: 140px;
            border: 3px solid rgba(244, 237, 226, 0.2);
            bottom: 30%;
            left: 10%;
            opacity: 0.6;
        }
        .receipts-orbs .o5 {
            width: 120px;
            height: 120px;
            background: #3E6E68;
            top: 18%;
            right: 8%;
            opacity: 0.85;
        }
        .receipts-orbs .o6 {
            width: 80px;
            height: 80px;
            border: 2px solid rgba(244, 237, 226, 0.25);
            top: 55%;
            right: 30%;
            opacity: 0.5;
        }
        .receipts-orbs .o7 {
            width: 100px;
            height: 100px;
            background: #7A4B5C;
            bottom: 45%;
            left: 25%;
            opacity: 0.7;
        }

        /* ── content layer ── */
        .receipts-content {
            position: relative;
            z-index: 2;
            max-width: 640px;
            margin: 0 auto;
        }

        /* header */
        .receipts-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .receipts-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(26px, 4vw, 36px);
            margin: 0;
            letter-spacing: -0.02em;
        }
        .receipts-header .sub {
            font-size: 13px;
            color: rgba(244, 237, 226, 0.5);
            margin-top: 4px;
        }
        .receipts-header .count-badge {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: rgba(244, 237, 226, 0.08);
            border: 1px solid rgba(244, 237, 226, 0.12);
            color: rgba(244, 237, 226, 0.6);
            padding: 6px 16px;
            border-radius: 999px;
            white-space: nowrap;
        }

        /* ── 5‑color rotating palette ── */
        .palette-1 {
            --card-bg: #FF6B6B;
            --card-text: #fff;
            --card-shadow: 0 8px 24px rgba(255, 107, 107, 0.35);
        }
        .palette-2 {
            --card-bg: #4ECDC4;
            --card-text: #fff;
            --card-shadow: 0 8px 24px rgba(78, 205, 196, 0.35);
        }
        .palette-3 {
            --card-bg: #FFD93D;
            --card-text: #231F1A;
            --card-shadow: 0 8px 24px rgba(255, 217, 61, 0.35);
        }
        .palette-4 {
            --card-bg: #6C5B7B;
            --card-text: #fff;
            --card-shadow: 0 8px 24px rgba(108, 91, 123, 0.35);
        }
        .palette-5 {
            --card-bg: #FF8A5C;
            --card-text: #fff;
            --card-shadow: 0 8px 24px rgba(255, 138, 92, 0.35);
        }

        /* ── receipt card ── */
        .receipt-card {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 20px 24px;
            border-radius: 24px;
            background: var(--card-bg, #f0ede8);
            color: var(--card-text, #231F1A);
            box-shadow: var(--card-shadow, 0 4px 14px rgba(0, 0, 0, 0.06));
            margin-bottom: 14px;
            text-decoration: none;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
                box-shadow 0.25s ease;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .receipt-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0);
            transition: background 0.3s ease;
            pointer-events: none;
        }
        .receipt-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: var(--card-shadow, 0 8px 28px rgba(0, 0, 0, 0.12));
        }
        .receipt-card:hover::after {
            background: rgba(255, 255, 255, 0.08);
        }
        .receipt-card .icon-wrap {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            backdrop-filter: blur(4px);
        }
        .receipt-card .info {
            flex: 1;
            min-width: 0;
        }
        .receipt-card .store {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 18px;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }
        .receipt-card .meta-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 3px;
            font-size: 13px;
            opacity: 0.75;
        }
        .receipt-card .meta-row .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.5;
        }
        .receipt-card .amount {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 20px;
            white-space: nowrap;
            letter-spacing: -0.01em;
        }
        .receipt-card .chevron-right {
            font-size: 18px;
            opacity: 0.5;
            margin-left: 4px;
            transition: transform 0.2s ease;
        }
        .receipt-card:hover .chevron-right {
            transform: translateX(4px);
            opacity: 0.8;
        }

        /* light text on dark cards gets a slight glow */
        .receipt-card .store,
        .receipt-card .amount {
            color: var(--card-text, #231F1A);
        }

        /* ── empty state ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(244, 237, 226, 0.4);
        }
        .empty-state .big-emoji {
            font-size: 56px;
            display: block;
            margin-bottom: 12px;
        }
        .empty-state h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 18px;
            color: rgba(244, 237, 226, 0.7);
            margin: 0 0 4px;
        }
        .empty-state p {
            font-size: 14px;
            margin: 0;
        }

        /* ── bottom tab bar ── */
        .tabbar-dark {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            background: rgba(35, 31, 26, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(244, 237, 226, 0.08);
            border-radius: 999px;
            padding: 6px;
            display: flex;
            gap: 4px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.50);
            z-index: 50;
        }
        .tabbar-dark a {
            text-decoration: none;
            color: rgba(244, 237, 226, 0.5);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 12.5px;
            padding: 10px 18px;
            border-radius: 999px;
            transition: all 0.2s ease;
        }
        .tabbar-dark a:hover {
            color: #F4EDE2;
            background: rgba(244, 237, 226, 0.06);
        }
        .tabbar-dark a.active {
            background: #E8492D;
            color: #fff;
            box-shadow: 0 4px 14px rgba(232, 73, 45, 0.40);
        }

        /* ── responsive ── */
        @media (max-width: 480px) {
            .receipts-scene {
                padding: 20px 16px 120px;
            }
            .receipt-card {
                padding: 16px 18px;
                gap: 14px;
            }
            .receipt-card .store {
                font-size: 16px;
            }
            .receipt-card .amount {
                font-size: 17px;
            }
            .receipt-card .icon-wrap {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            .tabbar-dark a {
                font-size: 11px;
                padding: 8px 12px;
            }
            .receipts-header h1 {
                font-size: 24px;
            }
            .receipts-orbs .o1 {
                width: 280px;
                height: 280px;
                top: -40px;
                left: -60px;
            }
            .receipts-orbs .o2 {
                width: 200px;
                height: 200px;
                bottom: 6%;
                right: -40px;
            }
            .receipts-orbs .o3 {
                width: 140px;
                height: 140px;
                top: 28%;
                left: 45%;
            }
            .receipts-orbs .o4 {
                width: 100px;
                height: 100px;
                bottom: 26%;
                left: 4%;
            }
            .receipts-orbs .o5 {
                width: 90px;
                height: 90px;
                top: 14%;
                right: 4%;
            }
            .receipts-orbs .o6 {
                width: 60px;
                height: 60px;
                top: 50%;
                right: 20%;
            }
            .receipts-orbs .o7 {
                width: 70px;
                height: 70px;
                bottom: 40%;
                left: 20%;
            }
        }
    </style>
</head>
<body>

    <!-- ─── DARK SCENE WITH FLOATING ORBS ─── -->
    <div class="receipts-scene" id="receiptsScene">
        <!-- floating orbs (third arrangement) -->
        <div class="receipts-orbs" id="orbContainer">
            <div class="orb o1"></div>
            <div class="orb o2"></div>
            <div class="orb o3"></div>
            <div class="orb o4"></div>
            <div class="orb o5"></div>
            <div class="orb o6"></div>
            <div class="orb o7"></div>
        </div>

        <!-- ─── CONTENT ─── -->
        <div class="receipts-content">
            <!-- header -->
            <div class="receipts-header">
                <div>
                    <h1>📋 Receipts</h1>
                    <div class="sub">All your scanned receipts in one place</div>
                </div>
                <span class="count-badge" id="receiptCount">0 receipts</span>
            </div>

            <!-- receipt list -->
            <div id="receiptList"></div>
        </div>

        <!-- ─── BOTTOM TAB BAR ─── -->
        <nav class="tabbar-dark">
            <a href="receipts.html" class="active">Receipts</a>
            <a href="scan.html">Scan</a>
            <a href="index.html">Dashboard</a>
        </nav>
    </div>

    <script>
        // ── data ──
        const receiptsData = [
            { id: 'r1', store: 'Albert Heijn', category: 'Groceries', amount: 54.30, date: 'Today, 14:23', icon: '🛒' },
            { id: 'r2', store: 'Uber Eats', category: 'Dining', amount: 22.80, date: 'Yesterday, 19:10', icon: '🍽️' },
            { id: 'r3', store: 'IKEA', category: 'Household', amount: 78.50, date: 'Yesterday, 11:45', icon: '🏠' },
            { id: 'r4', store: 'NS Reizen', category: 'Transport', amount: 12.40, date: 'Wed, 08:12', icon: '🚌' },
            { id: 'r5', store: 'Bol.com', category: 'Delivery', amount: 31.20, date: 'Wed, 16:30', icon: '📦' },
            { id: 'r6', store: 'Jumbo', category: 'Groceries', amount: 43.15, date: 'Tue, 09:50', icon: '🛒' },
            { id: 'r7', store: 'Thuisbezorgd', category: 'Dining', amount: 18.90, date: 'Mon, 20:05', icon: '🍽️' },
        ];

        // ── 5‑color palette ──
        const palette = ['palette-1', 'palette-2', 'palette-3', 'palette-4', 'palette-5'];

        // ── render ──
        const listEl = document.getElementById('receiptList');
        const countEl = document.getElementById('receiptCount');

        if (receiptsData.length === 0) {
            listEl.innerHTML = `
            <div class="empty-state">
              <span class="big-emoji">🧾</span>
              <h3>No receipts yet</h3>
              <p>Scan your first receipt to get started.</p>
            </div>
          `;
            countEl.textContent = '0 receipts';
        } else {
            countEl.textContent = receiptsData.length + ' receipts';
            receiptsData.forEach((r, i) => {
                const colorClass = palette[i % palette.length];
                const card = document.createElement('a');
                card.className = `receipt-card ${colorClass}`;
                card.href = `receipt.html?id=${r.id}`;
                card.innerHTML = `
              <div class="icon-wrap">${r.icon}</div>
              <div class="info">
                <div class="store">${r.store}</div>
                <div class="meta-row">
                  <span>${r.category}</span>
                  <span class="dot"></span>
                  <span>${r.date}</span>
                </div>
              </div>
              <div class="amount">−€${r.amount.toFixed(2)}</div>
              <span class="chevron-right">›</span>
            `;
                listEl.appendChild(card);
            });
        }

        // ── orb mouse‑following parallax ──
        const orbs = document.querySelectorAll('.orb');
        const scene = document.getElementById('receiptsScene');
        let mouseX = 0.5;
        let mouseY = 0.5;

        function updateOrbs() {
            const centerX = mouseX - 0.5;
            const centerY = mouseY - 0.5;
            orbs.forEach((orb, i) => {
                const depth = (i + 1) * 5;
                const x = centerX * depth;
                const y = centerY * depth;
                orb.style.transform = `translate(${x}px, ${y}px)`;
            });
        }

        scene.addEventListener('pointermove', function(e) {
            const rect = scene.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) / rect.width;
            mouseY = (e.clientY - rect.top) / rect.height;
            mouseX = Math.max(0, Math.min(1, mouseX));
            mouseY = Math.max(0, Math.min(1, mouseY));
            updateOrbs();
        });

        scene.addEventListener('pointerleave', function() {
            orbs.forEach(orb => {
                orb.style.transform = 'translate(0, 0)';
            });
        });

        // touch support
        scene.addEventListener('touchmove', function(e) {
            const t = e.touches[0];
            if (!t) return;
            const rect = scene.getBoundingClientRect();
            mouseX = (t.clientX - rect.left) / rect.width;
            mouseY = (t.clientY - rect.top) / rect.height;
            mouseX = Math.max(0, Math.min(1, mouseX));
            mouseY = Math.max(0, Math.min(1, mouseY));
            updateOrbs();
        }, { passive: true });

        scene.addEventListener('touchend', function() {
            orbs.forEach(orb => {
                orb.style.transform = 'translate(0, 0)';
            });
        }, { passive: true });
    </script>
</body>
</html>
