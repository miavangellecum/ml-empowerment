<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spend — Receipt Detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* reuse the dark scene style from receipts.html */
        .receipt-scene {
            position: relative;
            min-height: 100vh;
            padding: 28px 20px 130px;
            background: #231F1A;
            color: #F4EDE2;
            overflow: hidden;
        }
        .receipt-content {
            position: relative;
            z-index: 2;
            max-width: 640px;
            margin: 0 auto;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            color: rgba(244, 237, 226, 0.5);
            text-decoration: none;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            font-size: 14px;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #F4EDE2;
        }
        .back-link::before {
            content: "← ";
        }

        .receipt-card-detail {
            background: rgba(244, 237, 226, 0.06);
            border-radius: 24px;
            padding: 28px 24px;
            border: 1px solid rgba(244, 237, 226, 0.08);
            backdrop-filter: blur(4px);
        }
        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .receipt-header .store {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: -0.02em;
        }
        .receipt-header .total {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 28px;
            color: #7C9A79;
        }
        .receipt-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 24px;
            font-size: 14px;
            color: rgba(244, 237, 226, 0.6);
            border-bottom: 1px solid rgba(244, 237, 226, 0.08);
            padding-bottom: 16px;
            margin-bottom: 16px;
        }
        .receipt-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .receipt-meta .label {
            opacity: 0.6;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .items-table th {
            text-align: left;
            font-weight: 500;
            color: rgba(244, 237, 226, 0.4);
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(244, 237, 226, 0.06);
        }
        .items-table td {
            padding: 6px 0;
            border-bottom: 1px solid rgba(244, 237, 226, 0.04);
        }
        .items-table .item-name {
            font-weight: 500;
        }
        .items-table .item-qty {
            color: rgba(244, 237, 226, 0.5);
            font-size: 13px;
        }
        .items-table .item-price {
            text-align: right;
            font-weight: 600;
        }
        .items-table .item-category {
            font-size: 12px;
            color: rgba(244, 237, 226, 0.4);
            text-transform: capitalize;
        }

        .receipt-footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            border-top: 1px solid rgba(244, 237, 226, 0.08);
            padding-top: 16px;
            color: rgba(244, 237, 226, 0.6);
        }
        .receipt-footer .grand-total {
            font-weight: 700;
            color: #F4EDE2;
            font-size: 18px;
        }

        .s3-link {
            margin-top: 16px;
            display: block;
            font-size: 13px;
            color: rgba(244, 237, 226, 0.3);
            text-decoration: none;
            word-break: break-all;
        }
        .s3-link:hover {
            color: rgba(244, 237, 226, 0.6);
        }

        .loading-spinner {
            text-align: center;
            padding: 60px 0;
            color: rgba(244, 237, 226, 0.4);
        }
        .error-message {
            text-align: center;
            padding: 60px 0;
            color: #E8492D;
        }

        /* bottom tab bar – reuse from scan.html */
        .tabbar-dark {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            background: rgba(35, 31, 26, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(244, 237, 226, 0.08);
            border-radius: 999px;
            padding: 6px;
            display: flex;
            gap: 4px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.50);
            z-index: 50;
        }
        .tabbar-dark a {
            text-decoration: none;
            color: rgba(244, 237, 226, 0.5);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 12.5px;
            padding: 10px 18px;
            border-radius: 999px;
            transition: all 0.2s ease;
        }
        .tabbar-dark a:hover {
            color: #F4EDE2;
            background: rgba(244, 237, 226, 0.06);
        }
        .tabbar-dark a.active {
            background: #E8492D;
            color: #fff;
            box-shadow: 0 4px 14px rgba(232, 73, 45, 0.40);
        }
    </style>
</head>
<body>
    <div class="receipt-scene" id="receiptScene">
        <div class="receipt-content">
            <a href="receipts.html" class="back-link">Back to receipts</a>

            <div id="receiptDetail">
                <div class="loading-spinner">Loading receipt…</div>
            </div>
        </div>

        <nav class="tabbar-dark">
            <a href="receipts.html" class="active">Receipts</a>
            <a href="scan.html">Scan</a>
            <a href="reports.html">Reports</a>
            <a href="index.html">Dashboard</a>
        </nav>
    </div>

    <script src="js/data.js"></script>
    <script>
        (async function() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const container = document.getElementById('receiptDetail');

            if (!id) {
                container.innerHTML = `<div class="error-message">No receipt ID provided.</div>`;
                return;
            }

            try {
                // Use the new dedicated endpoint if available, fallback to fetchReceiptById if not
                let receipt;
                try {
                    const res = await fetch(`${API_BASE}/receipts/${encodeURIComponent(id)}`);
                    if (!res.ok) throw new Error('Not found');
                    receipt = await res.json();
                } catch (e) {
                    // fallback: fetch all and filter
                    console.warn('Falling back to fetchReceipts for single receipt');
                    receipt = await fetchReceiptById(id);
                    if (!receipt) throw new Error('Receipt not found');
                }

                // Build the detail view
                const meta = CATEGORY_META[receipt.category] || CATEGORY_META.other;
                const dateStr = receipt.date ? new Date(receipt.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Unknown date';
                const items = receipt.items || [];

                let itemsHtml = '';
                if (items.length) {
                    itemsHtml = `
                        <table class="items-table">
                            <thead><tr><th>Item</th><th class="item-category">Category</th><th style="text-align:right">Price</th></tr></thead>
                            <tbody>
                                ${items.map(item => `
                                    <tr>
                                        <td><span class="item-name">${item.name}</span> ${item.quantity > 1 ? `<span class="item-qty">×${item.quantity}</span>` : ''}</td>
                                        <td class="item-category">${item.category || 'other'}</td>
                                        <td class="item-price">€${(item.total_price ?? item.unit_price ?? 0).toFixed(2)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    itemsHtml = `<p style="color:rgba(244,237,226,0.4); margin:8px 0;">No line items available.</p>`;
                }

                const subtotal = receipt.subtotal != null ? receipt.subtotal.toFixed(2) : '—';
                const tax = receipt.tax != null ? receipt.tax.toFixed(2) : '—';
                const total = receipt.total != null ? receipt.total.toFixed(2) : '0.00';
                const s3Url = receipt.s3_url || null;

                container.innerHTML = `
                    <div class="receipt-card-detail">
                        <div class="receipt-header">
                            <div class="store">${receipt.store_name || 'Unknown store'}</div>
                            <div class="total">−€${total}</div>
                        </div>
                        <div class="receipt-meta">
                            <span><span class="label">Date</span> ${dateStr}</span>
                            <span><span class="label">Category</span> ${meta.icon} ${receipt.category || 'other'}</span>
                            ${receipt.payment_method ? `<span><span class="label">Payment</span> ${receipt.payment_method}</span>` : ''}
                            ${receipt.currency ? `<span><span class="label">Currency</span> ${receipt.currency}</span>` : ''}
                        </div>

                        ${itemsHtml}

                        <div class="receipt-footer">
                            <div>
                                <div>Subtotal: €${subtotal}</div>
                                <div>Tax: €${tax}</div>
                            </div>
                            <div class="grand-total">Total: €${total}</div>
                        </div>

                        ${s3Url ? `<a href="${s3Url}" target="_blank" class="s3-link">📎 View original receipt (S3)</a>` : ''}
                    </div>
                `;

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="error-message">Error loading receipt: ${err.message}</div>`;
            }
        })();
    </script>
</body>
</html>
